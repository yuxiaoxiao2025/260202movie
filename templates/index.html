<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美剧资源搜索 - 夸克网盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .search-box {
            background: white;
            border-radius: 50px;
            padding: 10px;
            display: flex;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .search-input {
            flex: 1;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            outline: none;
            border-radius: 50px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: scale(1.05);
        }
        
        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .results-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .results-header h2 {
            color: #333;
            font-size: 1.5em;
        }
        
        .result-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .result-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .result-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .meta-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .tag-year {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .tag-new {
            background: #e8f5e9;
            color: #388e3c;
        }
        
        .tag-classic {
            background: #fff3e0;
            color: #f57c00;
        }
        
        .tag-source {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        
        .result-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        
        .link-url {
            flex: 1;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9em;
            word-break: break-all;
        }
        
        .link-url:hover {
            text-decoration: underline;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
        }
        
        .copy-btn:hover {
            background: #5a6fd6;
        }
        
        .copy-btn.copied {
            background: #4caf50;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .tips {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        
        .tips h3 {
            margin-bottom: 10px;
        }
        
        .tips ul {
            list-style: none;
            text-align: left;
            display: inline-block;
        }
        
        .tips li {
            margin: 5px 0;
            opacity: 0.9;
        }
        
        .tips li:before {
            content: "• ";
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 美剧资源搜索</h1>
            <p>快速找到夸克网盘资源</p>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" 
                   placeholder="输入影片名称，如：Y计划、V世代..." 
                   onkeypress="if(event.key==='Enter') search()">
            <button class="search-btn" id="searchBtn" onclick="search()">搜索</button>
        </div>
        
        <div class="results" id="results" style="display: none;">
            <!-- 结果将在这里显示 -->
        </div>
        
        <div class="tips">
            <h3>💡 使用提示</h3>
            <ul>
                <li>输入影片名称，点击搜索按钮</li>
                <li>系统会自动识别年份和类型（新剧/经典剧）</li>
                <li>点击"复制链接"按钮复制夸克网盘地址</li>
                <li>在浏览器中打开链接即可保存到夸克网盘</li>
            </ul>
        </div>
    </div>
    
    <script>
        async function search() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入影片名称');
                return;
            }
            
            const btn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('results');
            
            btn.disabled = true;
            btn.textContent = '搜索中...';
            
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在搜索 "${keyword}"...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ keyword: keyword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.results, keyword);
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error-message">
                            搜索失败: ${data.error || '未知错误'}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error-message">
                        网络错误: ${error.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '搜索';
            }
        }
        
        function displayResults(results, keyword) {
            const resultsDiv = document.getElementById('results');
            
            if (!results || results.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>未找到 "${keyword}" 的资源</h3>
                        <p>请尝试其他关键词或稍后再试</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="results-header">
                    <h2>找到 ${results.length} 个资源</h2>
                </div>
            `;
            
            results.forEach((item, index) => {
                const yearTag = item.year ? `<span class="meta-tag tag-year">${item.year}年</span>` : '';
                const typeTag = item.resource_type === 'new' 
                    ? '<span class="meta-tag tag-new">新剧</span>' 
                    : item.resource_type === 'classic'
                    ? '<span class="meta-tag tag-classic">经典剧</span>'
                    : '';
                
                let linksHtml = '';
                item.quark_links.forEach((link, linkIndex) => {
                    linksHtml += `
                        <div class="link-item">
                            <a href="${link}" target="_blank" class="link-url">${link}</a>
                            <button class="copy-btn" onclick="copyLink('${link}', this)">复制链接</button>
                        </div>
                    `;
                });
                
                html += `
                    <div class="result-item">
                        <div class="result-title">${index + 1}. ${item.title}</div>
                        <div class="result-meta">
                            ${yearTag}
                            ${typeTag}
                            <span class="meta-tag tag-source">${item.source_name}</span>
                        </div>
                        <div class="result-links">
                            ${linksHtml}
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        async function copyLink(url, btn) {
            try {
                await navigator.clipboard.writeText(url);
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制链接';
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // 降级方案
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制链接';
                    btn.classList.remove('copied');
                }, 2000);
            }
        }
    </script>
</body>
</html>
